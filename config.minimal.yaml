# Minimal PM Analysis Tool Configuration File
# This file contains minimal configuration settings for basic operation

# Project settings
project:
  name: "PM Analysis Project"
  default_path: "./project_files"

# Required documents (empty for minimal config)
required_documents: []

# Simple mode configuration
modes:
  document_check:
    enabled: true
    output_formats: ["markdown"]
  status_analysis:
    enabled: true
    output_formats: ["markdown"]
  learning_module:
    enabled: true

# Basic output settings
output:
  directory: "./reports"
  timestamp_files: true

# Simple logging
logging:
  level: "INFO"
  console: true